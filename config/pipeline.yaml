# Ritim Online course translation pipeline: the one config file.
# Secrets are never stored here: ANTHROPIC_API_KEY, ELEVENLABS_API_KEY and AWS credentials
# come from the environment (see .env.example). Paths may use ${ENV_VAR} and ~.

paths:
  # On g6e.xlarge: instance-store NVMe is mounted at /opt/dlami/nvme by the DLAMI (see infra/NOTES.md).
  work_root: ${RITIM_WORK:-/opt/dlami/nvme/ritim/work}
  models_root: ${RITIM_MODELS:-/opt/ritim/models}     # EBS cache, survives Spot interruption
  envs_root: ${RITIM_ENVS:-/opt/ritim/envs}           # one venv per model family
  repos_root: ${RITIM_REPOS:-/opt/ritim/repos}        # pinned git checkouts (CosyVoice, LatentSync, MuseTalk)
  glossary_dir: glossary

s3:
  bucket: ${RITIM_S3_BUCKET:-ritim-videos}
  region: ${RITIM_S3_REGION:-eu-central-1}   # the bucket's region (the instance may run elsewhere)
  inputs_prefix: courses/        # courses/<course_id>/*.mp4 (+ course.yaml with title/description)
  work_prefix: work/             # resumable work dirs, synced after every stage
  outputs_prefix: outputs/       # outputs/<course_id>/<lesson>/hls/...
  voice_prefix: voice/           # voice/hakan/reference.wav + reference.txt (never in git)

source_language: tr

# Order matters: this is the default list for `ritim run`. The pilot uses --lang en,de.
languages:
  en:
    name: English
    tts_backend: elevenlabs
    lipsync: true
    chars_per_second: 15.0       # speech-rate budget; QA reports the measured rate so this can be tuned
    subtitle_line_chars: 42
  de:
    name: Deutsch
    tts_backend: elevenlabs
    lipsync: true
    chars_per_second: 14.5
    subtitle_line_chars: 42
  fr:
    name: Français
    tts_backend: tbd             # decided by the blind test: qwen3tts | chatterbox | cosyvoice
    lipsync: false
    chars_per_second: 14.5
    subtitle_line_chars: 42
  es:
    name: Español
    tts_backend: tbd
    lipsync: false
    chars_per_second: 15.5
    subtitle_line_chars: 42
  ja:
    name: 日本語
    tts_backend: tbd
    lipsync: false
    chars_per_second: 8.0        # counted without spaces
    subtitle_line_chars: 20
  zh:
    name: 中文
    tts_backend: tbd
    lipsync: false
    chars_per_second: 5.5
    subtitle_line_chars: 18

inventory:
  scene_threshold: 0.30          # ffmpeg scene score; slides change sharply so 0.3 is safe
  scene_fps: 4
  silence_db: -35
  silence_min_s: 0.35
  face_backend: mediapipe        # mediapipe | none
  face_sample_fps: 1.0
  large_face_min_height: 0.22    # face box height / frame height; PiP corner window is ~0.05-0.10
  min_face_segment_s: 3.0

chapters:
  min_s: 180
  target_s: 420
  max_s: 600

transcribe:
  backend: whisperx              # whisperx | scribe | mock
  env: audio
  model: large-v3
  compute_type: float16
  batch_size: 16
  vad_method: pyannote
  align: true
  initial_prompt: "VDA 6.3, IATF 16949, 8D, FMEA, APQP, PPAP, SPC, MSA, CQI-9, Ritim Yönetim."
  scribe_model: scribe_v2
  max_unit_s: 12.0               # sentences longer than this are split at the longest pause
  unit_pause_s: 0.8              # a pause this long always ends a unit

separate:
  backend: demucs                # demucs | passthrough
  env: audio
  model: htdemucs
  segment: 7                     # htdemucs max is 7.8 s
  shifts: 1

translate:
  backend: anthropic             # anthropic | mock
  model: claude-sonnet-5-5
  effort: medium
  max_tokens: 16000
  http_retries: 5
  validation_rounds: 2           # re-ask for ids that are missing, over budget or lost a protected term
  fallbacks: default             # server-side refusal fallback ("default" | "none")
  max_extend_s: 1.2              # a line may run this far into the following pause
  budget_factor: 0.95
  context_units: 4               # last translated lines of the previous chapter, for continuity

voice:
  sample_rate: 48000
  max_tempo: 1.12                # speed-up we accept without asking for a shorter line
  hard_max_tempo: 1.25
  shorten_rounds: 2
  min_gap_s: 0.06
  tempo_filter: atempo           # atempo | rubberband (if ffmpeg has librubberband)
  reference:
    # Downloaded from s3://<bucket>/voice/hakan/ by `ritim fetch-voice`. Never commit.
    audio: ${RITIM_MODELS:-/opt/ritim/models}/voice/hakan/reference.wav
    text_file: ${RITIM_MODELS:-/opt/ritim/models}/voice/hakan/reference.txt
    language: tr
  elevenlabs:
    voice_id: ${ELEVENLABS_VOICE_ID:-}      # professional voice clone of Hakan Bey
    model_id: eleven_multilingual_v2
    output_format: mp3_44100_192
    send_language_code: false               # only some models accept language_code
    stability: 0.5
    similarity_boost: 0.8
    style: 0.0
    use_speaker_boost: true
    concurrency: 3
  qwen3tts:
    env: qwen3tts
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    attn_implementation: sdpa               # flash_attention_2 if the wheel is installed
  chatterbox:
    env: chatterbox
    model: ResembleAI/chatterbox
    t3_model: v3
    exaggeration: 0.5
    cfg_weight: 0.3                         # README: lower cfg for cross-language reference
  cosyvoice:
    env: cosyvoice
    model: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
    repo: CosyVoice

lipsync:
  backend: latentsync            # latentsync | musetalk | none
  pad_s: 0.25
  max_chunk_s: 40                # LatentSync reads a whole clip into RAM; keep chunks small
  crop_scale: 2.2                # crop around the face (x face box) instead of feeding full frames
  latentsync:
    env: latentsync
    repo: LatentSync
    inference_steps: 20
    guidance_scale: 1.5
    deepcache: true
  musetalk:
    env: musetalk
    repo: MuseTalk
    bbox_shift: 0

assemble:
  background_gain_db: 0.0
  loudness_i: -16.0              # EBU R128 measurement (loudnorm); use -23 for strict broadcast R128
  loudness_tp: -1.5
  loudness_lra: 11.0
  hls_segment_s: 6
  video_encoder: auto            # auto (h264_nvenc if present) | libx264 | h264_nvenc
  video_quality: 23              # CRF for x264, CQ for NVENC
  audio_bitrate: 128k
  include_source_audio: true

qa:
  max_overlap_s: 0.05
  max_drift_s: 0.6
  max_tempo_warn: 1.15

# Rates for the cost estimate in the QA report. Set them to what you actually pay (credits still count).
costs:
  gpu_hour_usd: 0.0              # g6e.xlarge on-demand or Spot price in your region
  claude_input_per_mtok_usd: 2.0     # claude-sonnet-5-5
  claude_output_per_mtok_usd: 10.0
  claude_cache_read_per_mtok_usd: 0.2
  elevenlabs_per_1k_chars_usd: 0.0   # covered by the startup grant; set to your plan's overage rate

# Exact versions installed by infra/bootstrap.sh (envs) and infra/fetch_models.py (weights).
# Code is pinned here (pip ==, git commit). Hugging Face weights are pinned by commit sha in
# infra/models.lock.json: the first bootstrap resolves `revision` and writes the lock; commit it,
# and every later bootstrap installs exactly those shas. `dest: cache` = HF cache under
# <models_root>/hf (libraries load by repo name, offline); `dest: <dir>` = plain folder under models_root.
models:
  envs:
    audio:      {python: "3.12", pip: ["whisperx==3.8.6", "demucs==4.1.0"], torch: "2.8.0", cuda: cu128}
    qwen3tts:   {python: "3.12", pip: ["qwen-tts==0.1.1"], torch: "2.8.0", cuda: cu128}
    chatterbox: {python: "3.11", git: "https://github.com/resemble-ai/chatterbox", commit: 5de7a54aa4e5e2baadb0182dde554908b48b85c2}
    cosyvoice:  {python: "3.10", git: "https://github.com/FunAudioLLM/CosyVoice", commit: 074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc}
    latentsync: {python: "3.10.13", git: "https://github.com/bytedance/LatentSync", commit: a229c3948406bc2cf6eaf4873e662e70c6a04746}
    musetalk:   {python: "3.10", git: "https://github.com/TMElyralab/MuseTalk", commit: 0a89dec45a0192b824e3cf4daf96c239440c5ed8}
  weights:
    - {name: faster-whisper-large-v3, hf: Systran/faster-whisper-large-v3, revision: main, dest: "cache:whisper", licence: MIT, env: audio}
    - {name: align-tr, hf: mpoyraz/wav2vec2-xls-r-300m-cv7-turkish, revision: main, dest: cache, licence: check-model-card, env: audio}
    - {name: htdemucs, hf: adefossez/HTDemucs, revision: main, dest: cache, licence: MIT, env: audio}
    - {name: qwen3-tts-base, hf: Qwen/Qwen3-TTS-12Hz-1.7B-Base, revision: main, dest: cache, licence: Apache-2.0, env: qwen3tts}
    - {name: chatterbox-mtl, hf: ResembleAI/chatterbox, revision: main, dest: cache, licence: MIT, env: chatterbox,
       files: [ve.pt, t3_mtl23ls_v3.safetensors, s3gen.pt, grapheme_mtl_merged_expanded_v1.json, conds.pt, Cangjie5_TC.json]}
    - {name: cosyvoice3, hf: FunAudioLLM/Fun-CosyVoice3-0.5B-2512, revision: main, dest: cosyvoice/Fun-CosyVoice3-0.5B-2512, licence: Apache-2.0, env: cosyvoice}
    - {name: latentsync-1.6, hf: ByteDance/LatentSync-1.6, revision: main, dest: latentsync, licence: Apache-2.0, env: latentsync,
       files: [latentsync_unet.pt, whisper/tiny.pt]}
    - {name: sd-vae-ft-mse, hf: stabilityai/sd-vae-ft-mse, revision: main, dest: cache, licence: MIT, env: latentsync,
       files: [config.json, diffusion_pytorch_model.safetensors]}
    - {name: musetalk-1.5, hf: TMElyralab/MuseTalk, revision: main, dest: musetalk, licence: MIT, env: musetalk,
       files: [musetalkV15/musetalk.json, musetalkV15/unet.pth]}
    - {name: musetalk-sd-vae, hf: stabilityai/sd-vae-ft-mse, revision: main, dest: musetalk/sd-vae, licence: MIT, env: musetalk,
       files: [config.json, diffusion_pytorch_model.bin]}
    - {name: musetalk-whisper-tiny, hf: openai/whisper-tiny, revision: main, dest: musetalk/whisper, licence: Apache-2.0, env: musetalk,
       files: [config.json, pytorch_model.bin, preprocessor_config.json]}
    - {name: musetalk-dwpose, hf: yzd-v/DWPose, revision: main, dest: musetalk/dwpose, licence: Apache-2.0, env: musetalk,
       files: [dw-ll_ucoco_384.pth]}
    - {name: musetalk-face-parse-resnet18, url: "https://download.pytorch.org/models/resnet18-5c106cde.pth", dest: musetalk/face-parse-bisent/resnet18-5c106cde.pth, licence: BSD-3-Clause, env: musetalk}
    - {name: musetalk-face-parse, gdrive: 154JgKpzCPW82qINcVieuPH3fZ2e0P812, dest: musetalk/face-parse-bisent/79999_iter.pth, licence: MIT, env: musetalk}
    - {name: musetalk-s3fd, url: "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth", dest: torch/hub/checkpoints/s3fd-619a316812.pth, licence: BSD-3-Clause (face-alignment), env: musetalk}
    - {name: mediapipe-blazeface, url: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
       sha256: b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f, dest: mediapipe/blaze_face_short_range.tflite, licence: Apache-2.0, env: base}
