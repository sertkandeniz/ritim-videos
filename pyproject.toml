[project]
name = "ritim-dub"
version = "0.1.0"
description = "Ritim Online course translation pipeline: subtitles, cloned-voice dubbing, selective lip sync, HLS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# The orchestrator env is light on purpose: every GPU model runs in its own env
# (infra/envs/*) and is called through workers/*.py, so nothing here pulls in torch.
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=1.15,<2",
    "boto3>=1.34",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Face detection for `inventory` (MediaPipe, Apache-2.0). Optional so CI can skip it.
vision = [
    "mediapipe==1.1.1",
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "boto3-stubs[s3]",
]

[project.scripts]
ritim = "ritim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ritim"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "workers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish/CJK text in strings and comments is intended

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ritim"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "vision: needs the optional mediapipe/opencv extra",
]
