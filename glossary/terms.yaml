# Terminology table: the translator must use these renderings.
# status: approved = given by Ritim; review = suggested, to be confirmed by a native-speaking auditor.
# Keys are ISO 639-1 codes; `tr` lists the Turkish forms that trigger the term (lower-case match on stems).
terms:
